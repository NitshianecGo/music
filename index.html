<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Neon Glass Music</title>
  
  <!-- iOS PWA meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NeonMusic">

  <style>
    :root {
      --bg-color: #0b0d17;
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.12);
      --glass-blur: blur(25px);
      --neon-green: #00ff87;
      --neon-cyan: #60efff;
      --neon-pink: #ff007f;
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.6);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0 0 160px 0;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    /* Динамический неоновый фон */
    .glow-bg {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }
    .glow-ball-1 {
      position: absolute; top: -10%; left: -10%; width: 350px; height: 350px;
      background: radial-gradient(circle, rgba(0, 255, 135, 0.25), transparent 70%);
      filter: blur(50px);
    }
    .glow-ball-2 {
      position: absolute; bottom: 10%; right: -10%; width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255, 0, 127, 0.2), transparent 70%);
      filter: blur(60px);
    }

    /* Шапка приложения */
    header {
      padding: 50px 20px 15px;
      background: rgba(11, 13, 23, 0.6);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      position: sticky; top: 0; z-index: 10;
      border-bottom: 1px solid var(--glass-border);
      display: flex; justify-content: space-between; align-items: center;
    }
    header h2 {
      margin: 0; font-size: 22px; font-weight: 800;
      background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 255, 135, 0.3);
    }

    /* Экраны */
    .screen { display: none; padding: 20px; animation: fadeIn 0.3s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Поля ввода в стиле матового стекла */
    .glass-input {
      width: 100%; padding: 14px 18px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px; color: #fff;
      font-size: 15px; outline: none;
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      transition: all 0.3s ease;
    }
    .glass-input:focus {
      border-color: var(--neon-green);
      box-shadow: 0 0 15px rgba(0, 255, 135, 0.2);
    }

    /* Неоновые кнопки */
    .btn-neon {
      width: 100%; padding: 14px; margin-top: 12px;
      background: linear-gradient(135deg, var(--neon-green), var(--neon-cyan));
      border: none; border-radius: 16px;
      color: #050b14; font-weight: 700; font-size: 15px;
      cursor: pointer; box-shadow: 0 4px 20px rgba(0, 255, 135, 0.3);
      transition: transform 0.2s;
    }
    .btn-neon:active { transform: scale(0.97); }

    /* Карточки треков */
    .track-card {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      padding: 10px 14px; margin-bottom: 12px; border-radius: 18px;
    }
    .track-info { display: flex; align-items: center; gap: 14px; overflow: hidden; flex: 1; }
    .cover-img { width: 50px; height: 50px; border-radius: 12px; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .track-title { font-weight: 600; font-size: 14px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-artist { font-size: 12px; color: var(--text-sub); margin-top: 2px; }

    /* Кнопки действий внутри карточки */
    .icon-btn {
      background: none; border: none; color: #fff;
      font-size: 18px; padding: 8px; cursor: pointer; opacity: 0.8;
      transition: all 0.2s;
    }
    .icon-btn:active { transform: scale(1.2); color: var(--neon-green); }

    /* Нижний стеклянный плеер */
    .player-bar {
      position: fixed; bottom: 85px; left: 15px; right: 15px;
      background: rgba(20, 24, 40, 0.75);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      padding: 12px 16px; border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.2);
      z-index: 20;
    }
    .player-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; }

    /* Нижняя навигация */
    nav {
      position: fixed; bottom: 0; left: 0; right: 0; height: 75px;
      background: rgba(11, 13, 23, 0.8);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-top: 1px solid var(--glass-border);
      display: flex; justify-content: space-around; align-items: center;
      z-index: 30; padding-bottom: 10px;
    }
    nav button {
      background: none; border: none; color: var(--text-sub);
      font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px;
      transition: all 0.3s;
    }
    nav button.active {
      color: var(--neon-green);
      text-shadow: 0 0 10px rgba(0, 255, 135, 0.5);
    }

    /* Модальное окно текстов песен */
    .modal {
      display: none; position: fixed; inset: 0;
      background: rgba(5, 8, 18, 0.9);
      backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      padding: 30px 20px; z-index: 100; overflow-y: auto; text-align: center;
    }

    /* Кастомный ползунок управления */
    input[type=range] {
      -webkit-appearance: none; width: 100%; background: rgba(255,255,255,0.1); height: 6px; border-radius: 3px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%;
      background: var(--neon-green); box-shadow: 0 0 10px var(--neon-green);
    }
  </style>
</head>
<body>

  <!-- Фновые свечения -->
  <div class="glow-bg">
    <div class="glow-ball-1"></div>
    <div class="glow-ball-2"></div>
  </div>

  <header>
    <h2 id="appTitle">Neon Music</h2>
    <span style="font-size: 11px; padding: 4px 10px; background: rgba(255,255,255,0.08); border-radius: 12px; border: 1px solid var(--glass-border);">Glass Edition</span>
  </header>

  <!-- Экран 1: Поиск -->
  <div id="screen-home" class="screen active">
    <input type="text" id="searchInput" class="glass-input" placeholder="Поиск треков..." onkeyup="if(event.key==='Enter') searchMusic()">
    <div id="searchResults" style="margin-top: 16px;"></div>
  </div>

  <!-- Экран 2: Медиатека -->
  <div id="screen-library" class="screen">
    <button class="btn-neon" onclick="createAlbum()">+ Создать новый альбом</button>
    <h4 style="margin-top:24px; color: var(--neon-cyan);">Избранное</h4>
    <div id="favList"></div>
    <h4 style="margin-top:24px; color: var(--neon-pink);">Мои Альбомы</h4>
    <div id="albumsList"></div>
  </div>

  <!-- Экран 3: Радио -->
  <div id="screen-radio" class="screen">
    <input type="text" id="cityInput" class="glass-input" placeholder="Город (например, Moscow)" value="Moscow">
    <button class="btn-neon" onclick="loadRadio()">Найти FM станции</button>
    <div id="radioList" style="margin-top: 20px;"></div>
  </div>

  <!-- Экран 4: Настройки -->
  <div id="screen-settings" class="screen">
    <h4 style="color: var(--neon-green);">Шаг перемотки</h4>
    <select id="skipStepSelect" class="glass-input" onchange="updateSettings()">
      <option value="5">5 секунд</option>
      <option value="10">10 секунд</option>
      <option value="15">15 секунд</option>
    </select>

    <h4 style="margin-top:30px; color: var(--neon-cyan);">Таймер сна: <span id="timerVal">0</span> мин</h4>
    <input type="range" id="sleepTimer" min="0" max="120" value="0" step="5" oninput="updateTimer(this.value)">
  </div>

  <!-- Экран 5: Оффлайн -->
  <div id="screen-offline" class="screen">
    <h4 style="color: var(--neon-pink);">Скачанные треки (Без интернета)</h4>
    <div id="offlineList"></div>
  </div>

  <!-- Текст песни -->
  <div id="lyricsModal" class="modal">
    <button onclick="closeLyrics()" class="btn-neon" style="width:auto; float:right; padding: 6px 16px;">✕</button>
    <h3 id="lyricsTitle" style="margin-top: 40px;">Текст песни</h3>
    <p id="lyricsText" style="white-space: pre-wrap; color: var(--text-sub); font-size: 15px; line-height: 1.6;"></p>
  </div>

  <!-- Плеер -->
  <div class="player-bar">
    <div class="track-info">
      <img id="playerCover" class="cover-img" src="https://via.placeholder.com/50/0b0d17/ffffff?text=Music" alt="Cover">
      <div>
        <div id="playerTitle" class="track-title">Трек не выбран</div>
        <div id="playerArtist" class="track-artist">Выберите песню</div>
      </div>
    </div>
    <div class="player-controls">
      <button class="icon-btn" onclick="showLyrics()">📜</button>
      <button class="icon-btn" onclick="prevTrack()">⏮</button>
      <button class="icon-btn" onclick="rewind()">⏪</button>
      <button class="icon-btn" onclick="togglePlay()" id="playBtn" style="font-size: 24px; color: var(--neon-green);">▶</button>
      <button class="icon-btn" onclick="forward()">⏩</button>
      <button class="icon-btn" onclick="nextTrack()">⏭</button>
      <button class="icon-btn" onclick="toggleFav()">❤️</button>
    </div>
  </div>

  <!-- Навигация -->
  <nav>
    <button onclick="nav('home', this)" class="active"><span>🔍</span>Поиск</button>
    <button onclick="nav('library', this)"><span>📚</span>Коллекция</button>
    <button onclick="nav('radio', this)"><span>📻</span>Радио</button>
    <button onclick="nav('settings', this)"><span>⚙️</span>Опции</button>
    <button onclick="nav('offline', this)"><span>⚡</span>Оффлайн</button>
  </nav>

  <audio id="audio"></audio>

  <script>
    let db;
    let currentTrack = null;
    let playlist = [];
    let currentIndex = -1;
    let timerId = null;

    let settings = JSON.parse(localStorage.getItem('appSettings')) || { skipStep: 5 };
    let favorites = JSON.parse(localStorage.getItem('favs')) || [];
    let albums = JSON.parse(localStorage.getItem('albums')) || {};

    // Инициализация базы IndexedDB
    const req = indexedDB.open("NeonMusicPWA", 1);
    req.onupgradeneeded = e => e.target.result.createObjectStore("tracks", { keyPath: "id" });
    req.onsuccess = e => { db = e.target.result; renderOffline(); };

    window.addEventListener('load', () => {
      document.getElementById('skipStepSelect').value = settings.skipStep;
      if (!navigator.onLine) { nav('offline', document.querySelectorAll('nav button')[4]); }
      renderFavs();
      renderAlbums();
    });

    function nav(screenId, btn) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.getElementById('screen-' + screenId).classList.add('active');
      if(btn) btn.classList.add('active');
    }

    // Поиск треков
    async function searchMusic() {
      const q = document.getElementById('searchInput').value;
      if (!q) return;
      const res = await fetch(`https://discoveryprovider.audius.co/v1/tracks/search?query=${q}&app_name=NEON`);
      const data = await res.json();
      playlist = data.data.map(t => ({
        id: t.id,
        title: t.title,
        artist: t.user.name,
        cover: t.artwork['150x150'] || 'https://via.placeholder.com/50/0b0d17/ffffff?text=Music',
        url: `https://discoveryprovider.audius.co/v1/tracks/${t.id}/stream?app_name=NEON`
      }));
      renderPlaylist(playlist, 'searchResults');
    }

    function renderPlaylist(list, targetId) {
      const el = document.getElementById(targetId);
      el.innerHTML = list.map((t, idx) => `
        <div class="track-card">
          <div class="track-info" onclick="playIndex(${idx})">
            <img src="${t.cover}" class="cover-img">
            <div>
              <div class="track-title">${t.title}</div>
              <div class="track-artist">${t.artist}</div>
            </div>
          </div>
          <div>
            <button class="icon-btn" onclick="downloadTrack('${t.id}')">⬇️</button>
          </div>
        </div>
      `).join('');
    }

    // Воспроизведение
    const audio = document.getElementById('audio');
    function playIndex(idx) {
      currentIndex = idx;
      currentTrack = playlist[idx];
      audio.src = currentTrack.url;
      audio.play();
      document.getElementById('playerTitle').innerText = currentTrack.title;
      document.getElementById('playerArtist').innerText = currentTrack.artist;
      document.getElementById('playerCover').src = currentTrack.cover;
      document.getElementById('playBtn').innerText = '⏸';

      if ('mediaSession' in navigator) {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: currentTrack.title, artist: currentTrack.artist,
          artwork: [{ src: currentTrack.cover, sizes: '150x150', type: 'image/jpeg' }]
        });
      }
    }

    function togglePlay() {
      if (audio.paused) { audio.play(); document.getElementById('playBtn').innerText = '⏸'; }
      else { audio.pause(); document.getElementById('playBtn').innerText = '▶'; }
    }

    function rewind() { audio.currentTime -= parseInt(settings.skipStep); }
    function forward() { audio.currentTime += parseInt(settings.skipStep); }
    function nextTrack() { if (currentIndex < playlist.length - 1) playIndex(currentIndex + 1); }
    function prevTrack() { if (currentIndex > 0) playIndex(currentIndex - 1); }

    // Текст песни
    async function showLyrics() {
      if (!currentTrack) return;
      document.getElementById('lyricsModal').style.display = 'block';
      document.getElementById('lyricsTitle').innerText = currentTrack.title;
      document.getElementById('lyricsText').innerText = "Загрузка текста...";
      try {
        const res = await fetch(`https://api.lyrics.ovh/v1/${currentTrack.artist}/${currentTrack.title}`);
        const data = await res.json();
        document.getElementById('lyricsText').innerText = data.lyrics || "Текст песни не найден.";
      } catch {
        document.getElementById('lyricsText').innerText = "Не удалось загрузить текст.";
      }
    }
    function closeLyrics() { document.getElementById('lyricsModal').style.display = 'none'; }

    // Сохранение в оффлайн
    async function downloadTrack(id) {
      const track = playlist.find(t => t.id === id);
      const res = await fetch(track.url);
      const blob = await res.blob();
      const tx = db.transaction("tracks", "readwrite");
      tx.objectStore("tracks").put({ ...track, blob: blob });
      alert("Загружено в оффлайн!");
      renderOffline();
    }

    function renderOffline() {
      if (!db) return;
      const tx = db.transaction("tracks", "readonly");
      tx.objectStore("tracks").getAll().onsuccess = e => {
        const list = e.target.result;
        document.getElementById('offlineList').innerHTML = list.map(t => `
          <div class="track-card" onclick="playBlob('${t.id}')">
            <div class="track-info">
              <img src="${t.cover}" class="cover-img">
              <div><div class="track-title">${t.title}</div><div class="track-artist">${t.artist}</div></div>
            </div>
          </div>
        `).join('');
      };
    }

    function playBlob(id) {
      const tx = db.transaction("tracks", "readonly");
      tx.objectStore("tracks").get(id).onsuccess = e => {
        const t = e.target.result;
        audio.src = URL.createObjectURL(t.blob);
        audio.play();
        document.getElementById('playerTitle').innerText = t.title;
        document.getElementById('playerArtist').innerText = t.artist;
        document.getElementById('playerCover').src = t.cover;
      };
    }

    // Радио
    async function loadRadio() {
      const city = document.getElementById('cityInput').value;
      const res = await fetch(`https://de1.api.radio-browser.info/json/stations/byname/${city}`);
      const data = await res.json();
      document.getElementById('radioList').innerHTML = data.slice(0, 15).map(r => `
        <div class="track-card" onclick="playRadio('${r.url_resolved}', '${r.name}')">
          <div class="track-info">
            <div class="track-title">${r.name}</div>
          </div>
        </div>
      `).join('');
    }
    function playRadio(url, name) {
      audio.src = url; audio.play();
      document.getElementById('playerTitle').innerText = name;
      document.getElementById('playerArtist').innerText = "Прямой эфир (Радио)";
    }

    // Таймер сна
    function updateTimer(val) {
      document.getElementById('timerVal').innerText = val;
      if (timerId) clearTimeout(timerId);
      if (val > 0) {
        timerId = setTimeout(() => {
          audio.pause();
          document.getElementById('playBtn').innerText = '▶';
        }, val * 60 * 1000);
      }
    }

    function updateSettings() {
      settings.skipStep = document.getElementById('skipStepSelect').value;
      localStorage.setItem('appSettings', JSON.stringify(settings));
    }

    // Альбомы и Избранное
    function toggleFav() {
      if (!currentTrack) return;
      favorites.push(currentTrack);
      localStorage.setItem('favs', JSON.stringify(favorites));
      renderFavs();
    }
    function renderFavs() {
      document.getElementById('favList').innerHTML = favorites.map(t => `<div class="track-card"><div class="track-title">${t.title}</div></div>`).join('');
    }
    function createAlbum() {
      const name = prompt("Название альбома:");
      if (name) {
        albums[name] = [];
        localStorage.setItem('albums', JSON.stringify(albums));
        renderAlbums();
      }
    }
    function renderAlbums() {
      document.getElementById('albumsList').innerHTML = Object.keys(albums).map(a => `<div class="track-card"><div class="track-title">💿 ${a}</div></div>`).join('');
    }
  </script>
</body>
</html>
